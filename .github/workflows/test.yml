---
name: Run Mongoid Tests
'on':
- push
- pull_request
jobs:
  build:
    # skip github workflows on this branch; we'll rely solely on
    # evergreen for CI runs
    if: false

    name: "${{matrix.ruby}} db:${{matrix.mongodb}}
      rails:${{matrix.rails}} fle:${{matrix.fle}} ${{matrix.topology}}"
    env:
      CI: true
      TESTOPTS: "-v"
      BUNDLE_GEMFILE: "${{ matrix.rails == '' && 'Gemfile' || format('gemfiles/rails-{0}.gemfile', matrix.rails) }}"
    runs-on: ubuntu-22.04
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.3" ]
        mongodb: [ "8.0" ]
        rails: [ ~, "8.1" ]
        fle: [ ~, "helper" ]
        topology: [ replica_set, sharded_cluster ]

    steps:
    - name: repo checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      with:
        submodules: recursive

    # the default python 3.8 doesn't cut it, and causes mongo-orchestration
    # to fail in mongodb-labs/drivers-evergreen-tools.
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13'

    - id: start-mongodb
      name: start mongodb
      uses: mongodb-labs/drivers-evergreen-tools@8c66939e0f2ad8ec03522cd7e8631f5a55e2c9f2
      with:
        version: "${{matrix.mongodb}}"
        topology: "${{matrix.topology}}"
    - name: load ruby
      uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
      env:
        FLE: "${{matrix.fle}}"
        BUNDLE_GEMFILE: "${{env.BUNDLE_GEMFILE}}"
      with:
        ruby-version: "${{matrix.ruby}}"
        bundler: 2
    - name: bundle
      run: bundle install --jobs 4 --retry 3
      env:
        FLE: "${{matrix.fle}}"
        BUNDLE_GEMFILE: "${{env.BUNDLE_GEMFILE}}"
    - name: test
      timeout-minutes: 60
      continue-on-error: "${{matrix.experimental}}"
      run: bundle exec rake ci
      env:
        BUNDLE_GEMFILE: "${{env.BUNDLE_GEMFILE}}"
        FLE: "${{matrix.fle}}"
        MONGODB_URI: "${{ steps.start-mongodb.outputs.cluster-uri }}"
